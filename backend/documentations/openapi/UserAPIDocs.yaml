openapi: "3.0.0"
info:
  title: "User API"
  version: "1.0.0"
servers:
  - url: "http://localhost:3000"
    description: "Local server"

paths:
  /users:
    get:
      summary: "List users"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDTO'

    post:
      summary: "Create a user"
      description: >
        On success, sets the `UserId` cookie (see `UserIdCookie` security scheme) used by
        Room/Game endpoints to identify the current user on subsequent requests.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequestBody'

      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              description: "`UserId=<id>`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '400':
          description: User name already taken.
          content:
            application/json:
              schema:
                $ref: './Shared.yaml#/components/schemas/Error'


  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/userId'
    get:
      summary: "Get a user by id"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: './Shared.yaml#/components/schemas/Error'

    put:
      summary: "Edit a user"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEditRequestBody'

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'

    delete:
      summary: "Delete a user"
      responses:
        '200':
          description: OK, no content.



components:
  parameters:
    userId:
      name: "id"
      in: "path"
      schema:
        $ref: '#/components/schemas/UserID'
      required: true

  schemas:
    UserID:
        type: string
    UserDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    UsersDTO:
      allOf:
        - $ref: './Shared.yaml#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/UserDTO'

    UserEditRequestBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    UserCreateRequestBody:
      type: object
      properties:
        name:
          type: string
      required:
        - name
