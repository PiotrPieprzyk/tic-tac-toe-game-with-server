# Used by docker-compose.aws.yml. Same SPA setup as nginx.conf, plus a reverse
# proxy for the backend under /api (the SPA itself owns /rooms and /games).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/users → http://backend:3000/users, /api/ws → http://backend:3000/ws
    location /api/ {
        # Resolve `backend` through Docker's DNS on each request, so a restarted
        # backend container (new IP) doesn't break the proxy.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Keep idle WebSocket connections open.
        proxy_read_timeout 1h;
    }

    # SPA routing: let react-router handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
