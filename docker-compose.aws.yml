# Production-like stack used on the AWS EC2 instance (see aws/README.md).
#
#   docker compose -f docker-compose.aws.yml --env-file .env.aws up -d --build
#
# No postgres service: the backend talks to RDS. `.env.aws` is written on the
# instance by aws/lib/deploy.mjs from SSM Parameter Store and must define
# DB_HOST, DB_PASSWORD (RDS master), DB_APP_USER and DB_APP_PASSWORD.
#
# Startup order: migrate → db-grants → backend → frontend. Only the two
# one-shot containers get the master password; the long-running backend
# connects as the least-privilege app role.

# Cap container logs (default json-file logging grows without limit on the 10 GB disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile.prod

# RDS enforces TLS (sslmode=verify-full below); the RDS CA bundle is downloaded
# to /opt/rds-ca by the EC2 user-data script and mounted into every container
# that talks to RDS.

services:
  # One-shot: schema migrations, as the RDS master user.
  migrate:
    build: *backend-build
    image: tic-tac-toe-backend-aws
    container_name: tic-tac-toe-migrate-aws
    command: ["npm", "run", "migrate", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?DB_PASSWORD is required}@${DB_HOST:?DB_HOST is required}:5432/tic_tac_toe?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
    volumes:
      - /opt/rds-ca:/certs:ro
    logging: *logging

  # One-shot: creates/updates the app role and its grants (aws/db/app-role.sql),
  # after migrations so the grants cover every table.
  db-grants:
    image: postgres:16-alpine
    container_name: tic-tac-toe-db-grants-aws
    command: ["psql", "-f", "/sql/app-role.sql"]
    restart: "no"
    environment:
      PGHOST: ${DB_HOST:?DB_HOST is required}
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATABASE: tic_tac_toe
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /certs/rds-global-bundle.pem
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    volumes:
      - /opt/rds-ca:/certs:ro
      - ./aws/db:/sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Backend API. Not published on the host — only reachable through the
  # frontend nginx proxy (/api/* → backend:3000/*).
  backend:
    build: *backend-build
    image: tic-tac-toe-backend-aws
    container_name: tic-tac-toe-backend-aws
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_APP_USER}:${DB_APP_PASSWORD}@${DB_HOST}:5432/tic_tac_toe?sslmode=verify-full&sslrootcert=/certs/rds-global-bundle.pem
    volumes:
      - /opt/rds-ca:/certs:ro
    depends_on:
      db-grants:
        condition: service_completed_successfully
    logging: *logging

  # Frontend bundle served by nginx, which also proxies /api to the backend so
  # the browser only ever talks to one origin (no CORS, cookies just work).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_DOMAIN: /api
        # Bundle only; `pnpm run build` also runs `tsc -b`, which currently
        # fails on existing type errors and would block deploys.
        BUILD_COMMAND: pnpm exec vite build
    container_name: tic-tac-toe-frontend-aws
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.aws.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    logging: *logging
